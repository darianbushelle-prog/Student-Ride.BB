<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SchoolRide — Barbados GIS Transit Layer</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

:root{
  --navy:#003F87;
  --navy-dark:#002560;
  --navy-light:#1A5FA8;
  --gold:#F4B942;
  --teal:#0B7C6E;
  --cream:#FEFCF7;
  --sand:#F5EDD8;
  --white:#ffffff;
  --text:#1A1A2E;
  --text-soft:#718096;
  --shadow:0 6px 30px rgba(0,63,135,0.16);
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:'DM Sans',sans-serif;
  background:var(--cream);
}

.app{
  display:flex;
  flex-direction:column;
  height:100vh;
}

.topbar{
  height:60px;
  background:var(--navy);
  color:white;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 1.25rem;
  z-index:1200;
}

.topbar-left{
  display:flex;
  align-items:center;
  gap:12px;
}

.bus-badge{
  width:34px;
  height:34px;
  border-radius:10px;
  background:rgba(255,255,255,0.12);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:17px;
}

.top-title{
  font-family:'DM Serif Display',serif;
  font-size:18px;
}

.top-sub{
  font-size:11px;
  color:rgba(255,255,255,0.65);
}

.controls{
  display:flex;
  gap:10px;
}

.btn{
  border:none;
  border-radius:999px;
  padding:9px 15px;
  cursor:pointer;
  font-weight:700;
  font-size:12px;
  transition:0.2s ease;
}

.btn.gold{
  background:var(--gold);
  color:var(--navy);
}

.btn.dark{
  background:rgba(255,255,255,0.12);
  color:white;
}

.main{
  flex:1;
  display:flex;
  overflow:hidden;
}

.map-wrapper{
  flex:1;
  position:relative;
}

#map{
  width:100%;
  height:100%;
}

.side-panel{
  width:340px;
  background:white;
  border-left:1px solid rgba(0,0,0,0.08);
  overflow-y:auto;
  z-index:1000;
}

.hero{
  background:var(--navy);
  color:white;
  padding:1.2rem;
}

.hero-label{
  font-size:11px;
  letter-spacing:0.08em;
  text-transform:uppercase;
  color:var(--gold);
  font-weight:700;
  margin-bottom:6px;
}

.hero-title{
  font-family:'DM Serif Display',serif;
  font-size:24px;
}

.hero-sub{
  margin-top:8px;
  color:rgba(255,255,255,0.75);
  font-size:12px;
}

.stop-list{
  padding-bottom:40px;
}

.stop-item{
  padding:1rem 1.1rem;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #EEF2F7;
  cursor:pointer;
  transition:0.2s ease;
}

.stop-item:hover{
  background:#F8FBFF;
}

.stop-left{
  display:flex;
  gap:12px;
  align-items:center;
}

.stop-dot{
  width:28px;
  height:28px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-size:11px;
  font-weight:700;
}

.stop-name{
  font-size:13px;
  font-weight:700;
  color:var(--text);
}

.stop-sub{
  font-size:11px;
  color:var(--text-soft);
  margin-top:2px;
}

.stop-time{
  font-size:13px;
  font-weight:700;
  color:var(--navy);
}

.legend{
  position:absolute;
  left:16px;
  bottom:16px;
  background:white;
  border-radius:14px;
  box-shadow:var(--shadow);
  padding:12px;
  z-index:900;
  font-size:12px;
}

.legend-title{
  font-weight:700;
  color:var(--navy);
  margin-bottom:8px;
}

.legend-row{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:6px;
}

.legend-dot{
  width:11px;
  height:11px;
  border-radius:50%;
}

.leaflet-routing-container{
  display:none;
}

.custom-popup .leaflet-popup-content-wrapper{
  border-radius:16px;
}

.custom-popup .leaflet-popup-content{
  margin:12px;
  min-width:160px;
}

.popup-title{
  font-weight:700;
  color:var(--navy);
  margin-bottom:4px;
}

.popup-time{
  color:var(--teal);
  font-weight:700;
  font-size:13px;
}

.popup-sub{
  color:var(--text-soft);
  font-size:11px;
  margin-top:4px;
}

.bus-svg{
  width:34px;
  height:34px;
  transform-origin:center;
}

.bus-shell{
  fill:#F4B942;
  stroke:#003F87;
  stroke-width:2;
}

.bus-window{
  fill:white;
}

.leaflet-control-attribution{
  font-size:10px;
}

@media(max-width:820px){
  .side-panel{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    width:100%;
    height:46%;
    border-radius:24px 24px 0 0;
  }
}
</style>
</head>
<body>

<div class="app">

  <nav class="topbar">
    <div class="topbar-left">
      <div class="bus-badge">🚌</div>

      <div>
        <div class="top-title">Route 12 — North</div>
        <div class="top-sub">Speightstown → Harrison College</div>
      </div>
    </div>

    <div class="controls">
      <button class="btn gold" onclick="animateBus()">▶ Simulate Bus</button>
      <button class="btn dark" onclick="resetBus()">Reset</button>
    </div>
  </nav>

  <div class="main">

    <div class="map-wrapper">
      <div id="map"></div>

      <div class="legend">
        <div class="legend-title">Map Key</div>

        <div class="legend-row">
          <div class="legend-dot" style="background:#F4B942"></div>
          Terminal
        </div>

        <div class="legend-row">
          <div class="legend-dot" style="background:#1A5FA8"></div>
          Route Stop
        </div>

        <div class="legend-row">
          <div class="legend-dot" style="background:#0B7C6E"></div>
          Your Stop
        </div>

        <div class="legend-row">
          <div class="legend-dot" style="background:#003F87"></div>
          School
        </div>
      </div>
    </div>

    <aside class="side-panel">

      <div class="hero">
        <div class="hero-label">Assigned Stop</div>
        <div class="hero-title">Clapham Main Rd</div>
        <div class="hero-sub">
          Real GIS Routing · Barbados Transit Prototype
        </div>
      </div>

      <div class="stop-list" id="stopList"></div>

    </aside>

  </div>
</div>

<script>

const map = L.map('map', {
  zoomControl: true,
  minZoom: 10,
  maxZoom: 18,
  zoomSnap: 0.25
}).setView([13.1939, -59.5432], 11);

L.tileLayer(
  'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
  {
    attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
  }
).addTo(map);

const stops = [
  {
    name:'Speightstown Terminal',
    lat:13.2501,
    lng:-59.6438,
    type:'start',
    time:'6:10 AM',
    sub:'St. Peter Terminal'
  },
  {
    name:"Six Men's",
    lat:13.2314,
    lng:-59.6419,
    type:'regular',
    time:'6:20 AM',
    sub:'Highway 1'
  },
  {
    name:'Holetown',
    lat:13.1869,
    lng:-59.6381,
    type:'regular',
    time:'6:32 AM',
    sub:'Limegrove area'
  },
  {
    name:'Paynes Bay',
    lat:13.1537,
    lng:-59.6380,
    type:'regular',
    time:'6:40 AM',
    sub:'West coast corridor'
  },
  {
    name:'Clapham Main Rd',
    lat:13.1013,
    lng:-59.5962,
    type:'you',
    time:'6:47 AM',
    sub:'Assigned stop'
  },
  {
    name:'Fontabelle',
    lat:13.1032,
    lng:-59.6197,
    type:'regular',
    time:'6:58 AM',
    sub:'Bridgetown edge'
  },
  {
    name:'Harrison College',
    lat:13.1025,
    lng:-59.6061,
    type:'school',
    time:'7:25 AM',
    sub:'School terminus'
  }
];

function getColor(type){
  switch(type){
    case 'start': return '#F4B942';
    case 'you': return '#0B7C6E';
    case 'school': return '#003F87';
    default: return '#1A5FA8';
  }
}

const stopList = document.getElementById('stopList');

const markers = [];

stops.forEach((stop,index)=>{

  const marker = L.circleMarker([stop.lat, stop.lng], {
    radius: stop.type === 'you' ? 10 : 7,
    fillColor:getColor(stop.type),
    color:'#ffffff',
    weight:3,
    fillOpacity:1
  }).addTo(map);

  marker.bindPopup(`
    <div class="popup-title">${stop.name}</div>
    <div class="popup-time">${stop.time}</div>
    <div class="popup-sub">${stop.sub}</div>
  `,{ className:'custom-popup' });

  markers.push(marker);

  const item = document.createElement('div');
  item.className = 'stop-item';

  item.innerHTML = `
    <div class="stop-left">

      <div class="stop-dot"
        style="background:${getColor(stop.type)}">
        ${index + 1}
      </div>

      <div>
        <div class="stop-name">${stop.name}</div>
        <div class="stop-sub">${stop.sub}</div>
      </div>

    </div>

    <div class="stop-time">${stop.time}</div>
  `;

  item.onclick = () => {
    map.flyTo([stop.lat, stop.lng], 14, {
      duration:1.4
    });

    marker.openPopup();
  };

  stopList.appendChild(item);
});

const routingControl = L.Routing.control({

  waypoints: stops.map(stop =>
    L.latLng(stop.lat, stop.lng)
  ),

  routeWhileDragging:false,
  addWaypoints:false,
  draggableWaypoints:false,
  fitSelectedRoutes:true,
  show:false,

  lineOptions:{
    styles:[
      {
        color:'#003F87',
        opacity:0.95,
        weight:7
      },
      {
        color:'#F4B942',
        opacity:0.55,
        weight:12
      }
    ]
  },

  createMarker: () => null

}).addTo(map);

const busIcon = L.divIcon({
  className:'',
  html:`
    <svg class="bus-svg" viewBox="0 0 64 64">
      <rect x="10" y="14" width="44" height="30" rx="10" class="bus-shell"/>
      <rect x="16" y="20" width="12" height="8" rx="2" class="bus-window"/>
      <rect x="36" y="20" width="12" height="8" rx="2" class="bus-window"/>
      <circle cx="20" cy="48" r="5" fill="#003F87"/>
      <circle cx="44" cy="48" r="5" fill="#003F87"/>
    </svg>
  `,
  iconSize:[34,34],
  iconAnchor:[17,17]
});

let busMarker = L.marker(
  [stops[0].lat, stops[0].lng],
  { icon: busIcon }
).addTo(map);

let routeCoordinates = [];
let animationFrame = null;
let currentIndex = 0;

routingControl.on('routesfound', function(e){

  const route = e.routes[0];

  routeCoordinates = route.coordinates;

  map.fitBounds(L.latLngBounds(routeCoordinates), {
    padding:[50,50]
  });
});

function animateBus(){

  if(!routeCoordinates.length) return;

  cancelAnimationFrame(animationFrame);

  currentIndex = 0;

  function move(){

    if(currentIndex >= routeCoordinates.length){
      return;
    }

    const point = routeCoordinates[currentIndex];

    busMarker.setLatLng(point);

    if(currentIndex % 15 === 0){
      map.panTo(point, {
        animate:true,
        duration:0.5
      });
    }

    currentIndex += 1;

    animationFrame = requestAnimationFrame(move);
  }

  move();
}

function resetBus(){

  cancelAnimationFrame(animationFrame);

  busMarker.setLatLng([
    stops[0].lat,
    stops[0].lng
  ]);

  map.flyTo([
    13.1939,
    -59.5432
  ], 11, {
    duration:1.4
  });
}

</script>

</body>
</html>
